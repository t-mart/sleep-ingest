name: Check and publish

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.30.2-pg18
        env:
          POSTGRES_USER: sleep_ingest
          POSTGRES_PASSWORD: sleep_ingest
          POSTGRES_DB: sleep_ingest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=sleep_ingest --dbname=sleep_ingest"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://sleep_ingest:sleep_ingest@localhost:5432/sleep_ingest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ty check
      - run: uv run --no-sync pytest

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
