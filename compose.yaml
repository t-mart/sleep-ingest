services:
  timescaledb:
    image: timescale/timescaledb:2.30.2-pg18
    environment:
      POSTGRES_USER: sleep_ingest
      POSTGRES_PASSWORD: sleep_ingest
      POSTGRES_DB: sleep_ingest
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--username=sleep_ingest", "--dbname=sleep_ingest"]
      interval: 2s
      timeout: 5s
      retries: 30
